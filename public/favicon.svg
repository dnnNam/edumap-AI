<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Squircle dark container -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#131428" />
  
  <!-- 4-point curved star icon -->
  <!-- Top: (50, 24), Right: (72, 51), Bottom: (50, 78), Left: (28, 51) with concave curves to (50, 51) -->
  <path 
    d="M 50 24 
       C 52 40, 58 48, 72 51 
       C 58 54, 52 62, 50 78 
       C 48 62, 42 54, 28 51 
       C 42 48, 48 40, 50 24 Z" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Plus symbol at top-right -->
  <path 
    d="M 72 26 L 72 36 M 67 31 L 77 31" 
    stroke="#FFFFFF" 
    stroke-width="4.5" 
    stroke-linecap="round"
  />
  
  <!-- Circle dot at bottom-left -->
  <circle 
    cx="30" 
    cy="72" 
    r="4.5" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="4"
  />
</svg>