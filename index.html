<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon hiển thị trên tab trình duyệt -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="EduMap AI - Nền tảng định hướng nghề nghiệp và lộ trình học tập cá nhân hóa cho sinh viên IT."
    />

    <title>EduMap AI — A Roadmap for Education</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7L3ZY4VJBJ"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())

      gtag('config', 'G-7L3ZY4VJBJ')
    </script>

    <!-- Theme & Splash Session Check: Nếu đã xem splash trong phiên này thì ẩn pre-splash ngay -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('edumap-theme')
          if (saved === 'dark') {
            document.documentElement.classList.add('dark')
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.style.colorScheme = 'dark'
          } else {
            document.documentElement.classList.remove('dark')
            document.documentElement.setAttribute('data-theme', 'light')
            document.documentElement.style.colorScheme = 'light'
          }

          if (sessionStorage.getItem('edumap_splash_seen') === 'true') {
            document.documentElement.classList.add('skip-initial-splash')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      .skip-initial-splash #initial-splash {
        display: none !important;
      }
    </style>
  </head>

  <body style="margin: 0; background-color: #121114">
    <!-- Pre-React Splash: Ngăn chặn hoàn toàn hiện tượng chớp trắng trước khi React bundle tải xong -->
    <div
      id="initial-splash"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #121114;
        z-index: 999999;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      "
    >
      <div
        style="
          width: 80px;
          height: 80px;
          border-radius: 20px;
          background: #131428;
          border: 1px solid rgba(255, 255, 255, 0.1);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 0 25px rgba(79, 70, 229, 0.35);
          margin-bottom: 18px;
        "
      >
        <img src="/favicon.svg" alt="EduMap AI" style="width: 52px; height: 52px; object-fit: contain" />
      </div>
      <div style="font-size: 26px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px">
        EduMap
        <span style="color: #a99dff; margin-left: 2px">AI</span>
      </div>
      <div
        style="
          font-size: 11px;
          font-weight: 600;
          color: #85808c;
          letter-spacing: 2px;
          margin-top: 6px;
          text-transform: uppercase;
        "
      >
        A Roadmap for Education
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
