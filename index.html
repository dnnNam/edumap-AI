<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon hiển thị trên tab trình duyệt -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="EduMap AI - Nền tảng định hướng nghề nghiệp và lộ trình học tập cá nhân hóa cho sinh viên IT."
    />

    <title>EduMap AI — A Roadmap for Education</title>

    <!-- Theme Initialization Script: Chống nháy FOUC trước khi DOM render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('edumap-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
